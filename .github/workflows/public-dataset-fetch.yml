name: Public dataset fetch (list or download open-licence files; nothing is stored in this repo)
on:
  workflow_dispatch:
    inputs:
      dataset:
        description: "Hugging Face dataset id"
        required: true
        default: "aykutkabaoglu/uav-flight-anomaly-dataset"
      mode:
        description: "list = file names and sizes; fetch = download files listed in 'files'; cleanup = delete temporary drop branches; ulog = census + GPS-flight extract of PX4 logs listed in the dataset's mapping.json; commons_audio = Commons audio by title (files = JSON list of titles), 16 kHz mono FLAC"
        required: true
        default: "list"
      files:
        description: "fetch only: comma-separated paths inside the dataset"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Delete temporary drop branches
        if: inputs.mode == 'cleanup'
        run: |
          git init -q t && cd t
          git ls-remote --heads "https://github.com/${{ github.repository }}.git" 'tmp-drop-*' | awk '{print $2}' | while read r; do
            git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" --delete "${r#refs/heads/}" && echo "deleted $r"; done
      - uses: actions/checkout@v4
        if: inputs.mode == 'ulog' || inputs.mode == 'commons_audio'
        with:
          path: repo
      - name: PX4 log census and GPS-flight extract
        if: inputs.mode == 'ulog'
        env:
          DS: ${{ inputs.dataset }}
        run: |
          pip install -q pyulog==1.3.0 numpy
          mkdir -p out
          curl -sSL -o out/mapping.json "https://huggingface.co/datasets/$DS/resolve/main/mapping.json"
          python3 repo/tools/ulog_extract.py "$DS" out/mapping.json out 6
          rm -f out/tmp_*
          printf 'Source: https://huggingface.co/datasets/%s (CC BY 4.0). Extract of selected PX4 topics; unchanged values.\n' "$DS" > out/ATTRIBUTION.txt
          du -sh out
      - name: Commons audio (by title)
        if: inputs.mode == 'commons_audio'
        env:
          TITLES: ${{ inputs.files }}
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg > /dev/null
          mkdir -p out && printf '%s' "$TITLES" > titles.json
          python3 repo/tools/commons_audio.py titles.json out 360
          du -sh out
      - name: List or fetch
        if: inputs.mode == 'list' || inputs.mode == 'fetch'
        env:
          DS: ${{ inputs.dataset }}
          MODE: ${{ inputs.mode }}
          FILES: ${{ inputs.files }}
        run: |
          mkdir -p out
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse, hashlib
          ds, mode = os.environ["DS"], os.environ["MODE"]
          api = f"https://huggingface.co/api/datasets/{ds}"
          def get(u):
              with urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "dataset-fetch"}), timeout=120) as r:
                  return r.read(), r.headers
          if mode == "list":
              info, _ = get(api)
              open("out/info.json", "wb").write(info)
              files, url = [], api + "/tree/main?recursive=true&expand=false"
              while url:
                  body, h = get(url)
                  files += json.loads(body)
                  nxt = None
                  for part in (h.get("Link") or "").split(","):
                      if 'rel="next"' in part:
                          nxt = part[part.find("<") + 1:part.find(">")]
                  url = nxt
              files = [{"path": f["path"], "type": f["type"], "size": f.get("size")} for f in files]
              json.dump(files, open("out/files.json", "w"), indent=0)
              n = sum(1 for f in files if f["type"] == "file"); gb = sum(f["size"] or 0 for f in files) / 1e9
              print(f"{n} files, {gb:.2f} GB")
          else:
              man = []
              for p in [x.strip() for x in os.environ["FILES"].split(",") if x.strip()]:
                  u = f"https://huggingface.co/datasets/{ds}/resolve/main/" + urllib.parse.quote(p)
                  dst = os.path.join("out", p); os.makedirs(os.path.dirname(dst) or "out", exist_ok=True)
                  body, _ = get(u); open(dst, "wb").write(body)
                  man.append({"path": p, "bytes": len(body), "sha256": hashlib.sha256(body).hexdigest()})
                  print(p, len(body))
              json.dump(man, open("out/fetch_manifest.json", "w"), indent=1)
          PY
      - name: Hand over through a temporary branch (deleted after it is read)
        if: inputs.mode != 'cleanup'
        run: |
          cd out
          git init -q -b drop && git add -A
          git -c user.name=dataset-fetch -c user.email=dataset-fetch@users.noreply.github.com commit -qm "temporary drop: ${{ inputs.mode }} (public open-licence data; ${{ inputs.dataset }})"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" drop:refs/heads/tmp-drop-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: inputs.mode != 'cleanup'
        with:
          name: dataset-${{ inputs.mode }}
          path: out
          retention-days: 3
